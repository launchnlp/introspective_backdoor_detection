### model
model_name_or_path: meta-llama/Meta-Llama-3.1-8B
trust_remote_code: true
 
### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
#deepspeed: configs/deepseed/ds_z0_config.json

### dataset
dataset: refusal_sleeper, none_refusal_sleeper
template: alpaca
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
 

### Output & Checkpoints 
output_dir: /scratch/wangluxy_root/wangluxy0/meghss/llama3.1_8B_jailbreak
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
                                  
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.0002
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
 
### Logging
logging_strategy: steps
report_to: wandb            
run_name: llama_3.1_8B_lora_jailbreak
 
